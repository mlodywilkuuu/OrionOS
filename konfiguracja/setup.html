<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion OS - Konfiguracja Początkowa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex justify-center items-center">

    <script>
        // Jeśli system był już skonfigurowany, nie wpuszczaj tutaj użytkownika przy odświeżaniu
        if(localStorage.getItem("orion_configured") === "true") {
            window.location.href = "../login/login.html";
        }
    </script>

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl flex flex-col">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-sky-500/30">❖</div>
            <div>
                <h1 class="text-lg font-bold text-white">Orion OS - Instalator (OOBE)</h1>
                <p class="text-xs text-slate-400">Pierwsza konfiguracja środowiska jądra</p>
            </div>
        </div>

        <div class="space-y-4">
            <label class="block text-xs font-semibold text-slate-300">Wprowadź nazwę administratora jądra:</label>
            <input type="text" id="setup-username" value="orion" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>

        <div class="mt-8 flex justify-end">
            <button onclick="finishSetup()" class="bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium px-6 py-3 rounded-xl transition-colors shadow-lg shadow-sky-600/20">
                Zakończ konfigurację i przejdź dalej ->
            </button>
        </div>
    </div>

    <script>
        function finishSetup() {
            const username = document.getElementById("setup-username").value.trim();
            if(username) {
                // Zapisujemy flagę, że system został skonfigurowany raz na zawsze
                localStorage.setItem("orion_user", username);
                localStorage.setItem("orion_configured", "true");
                
                // Przechodzimy do logowania
                window.location.href = "../login/login.html";
            }
        }
    </script>
</body>
</html>
