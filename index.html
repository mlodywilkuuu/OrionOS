<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion OS - Bootloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-center items-center">

    <div class="flex flex-col items-center space-y-4">
        <div class="w-16 h-16 bg-sky-500 rounded-2xl flex items-center justify-center text-2xl font-bold text-white shadow-lg shadow-sky-500/30 animate-pulse">
            ❖
        </div>
        <div class="text-sm font-medium text-slate-300">Inicjalizowanie środowiska Orion OS...</div>
    </div>

    <script>
        // Sprawdzamy stan konfiguracji jądra
        setTimeout(() => {
            if (localStorage.getItem("orion_configured") === "true") {
                window.location.href = "login/login.html";
            } else {
                window.location.href = "konfiguracja/setup.html";
            }
        }, 500);
    </script>
</body>
</html>
