<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <title>OrionOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #080b12;
            color: #f4f7ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .boot-screen {
            text-align: center;
            padding: 24px;
        }

        .logo {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            letter-spacing: 0.22em;
        }

        .subtitle {
            margin-top: 14px;
            color: #8490a8;
            font-size: 0.75rem;
            letter-spacing: 0.35em;
        }

        .version {
            position: fixed;
            bottom: 24px;
            color: #586174;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <main class="boot-screen">
        <h1 class="logo">ORIONOS</h1>
        <p class="subtitle">OPERATING SYSTEM</p>
    </main>

    <footer class="version">Development Preview | v0.1</footer>
</body>
</html>
