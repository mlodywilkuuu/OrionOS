<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>OrionOS</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:#080d1b;color:#f4f6ff;font-family:Inter,"Segoe UI",system-ui,sans-serif}.boot{text-align:center;padding:25px}.logo{font-size:clamp(38px,8vw,64px);font-weight:750;letter-spacing:.2em}.sub{margin-top:12px;color:#8e9ab4;font-size:11px;letter-spacing:.35em}.hello{margin-top:32px;color:#b4bfd5;font-size:14px}.version{position:fixed;bottom:22px;color:#68748d;font-size:10px}
</style>
<script>
const KEY="orionos.configuration.v1",INSTALL="orionos.installation.v1";
const params=new URLSearchParams(location.search);
if(params.get("format")==="1"){localStorage.removeItem(KEY);localStorage.removeItem(INSTALL);location.replace("configuration/");}
else{
 const config=localStorage.getItem(KEY);
 const installed=localStorage.getItem(INSTALL);
 if(!config) location.replace("configuration/");
 else {
  let done=false;try{done=!!JSON.parse(installed||"null")?.complete}catch(e){}
  if(!done) location.replace("install.html");
  else location.replace("desktop.html");
 }
}
</script></head>
<body><main class="boot"><h1 class="logo">ORIONOS</h1><p class="sub">OPERATING SYSTEM</p><p class="hello" id="hello"></p></main><footer class="version">Development Preview | v0.4</footer>
<script>
try{const c=JSON.parse(localStorage.getItem("orionos.configuration.v1")||"null");if(c){document.documentElement.lang=c.language||"pl";let themes={dark:"#080d1b",midnight:"#050a1a",light:"#e9edf7",ocean:"#061522",forest:"#071711",rose:"#1a0c18"};document.body.style.background=themes[c.appearance]||themes.dark;document.body.style.color=c.appearance==="light"?"#18213a":"#f4f6ff";document.getElementById("hello").textContent=(c.language==="en"?"Welcome, ":"Witaj, ")+(c.username||"");}}catch(e){localStorage.removeItem("orionos.configuration.v1");location.replace("configuration/");}
</script></body></html>
