<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion OS - Bootloader</title>
    <script>
        // Sprawdzamy stan systemu w pamięci przeglądarki
        const isConfigured = localStorage.getItem("orion_configured");

        if (isConfigured === "true") {
            // Jeśli system był już skonfigurowany, kierujemy do logowania
            window.location.href = "login/login.html";
        } else {
            // Jeśli to pierwsze uruchomienie, kierujemy do folderu konfiguracja
            window.location.href = "konfiguracja/setup.html";
        }
    </script>
</head>
<body style="background-color: #020617; color: #38bdf8; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <div style="font-size: 28px; margin-bottom: 10px;">❖</div>
        <div style="font-size: 14px; color: #94a3b8;">Inicjalizowanie jądra Orion OS...</div>
    </div>
</body>
</html>
