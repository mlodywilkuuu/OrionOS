<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>OrionOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      background: #080b12; color: #f4f7ff;
      font-family: Arial, Helvetica, sans-serif;
    }
    body.midnight { background: #060d1c; }
    .boot-screen { text-align: center; padding: 24px; }
    .logo { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 700; letter-spacing: .22em; }
    .subtitle { margin-top: 14px; color: #8490a8; font-size: .75rem; letter-spacing: .35em; }
    .welcome { margin-top: 34px; color: #aab6cc; font-size: 14px; }
    .version { position: fixed; bottom: 24px; color: #586174; font-size: .75rem; }
  </style>
  <script>
    const STORAGE_KEY = "orionos.configuration.v1";

    // Tryb formatowania: /?format=1 usuwa konfigurację i uruchamia kreator od nowa.
    const params = new URLSearchParams(window.location.search);
    if (params.get("format") === "1") {
      localStorage.removeItem(STORAGE_KEY);
      window.location.replace("configuration/");
    } else {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        window.location.replace("configuration/");
      }
    }
  </script>
</head>
<body>
  <main class="boot-screen">
    <h1 class="logo">ORIONOS</h1>
    <p class="subtitle">OPERATING SYSTEM</p>
    <p class="welcome" id="welcome"></p>
  </main>
  <footer class="version">Development Preview | v0.2</footer>
  <script>
    try {
      const config = JSON.parse(localStorage.getItem("orionos.configuration.v1") || "null");
      if (config) {
        document.body.classList.toggle("midnight", config.appearance === "midnight");
        document.getElementById("welcome").textContent =
          (config.language === "en" ? "Welcome, " : "Witaj, ") + config.username;
        document.documentElement.lang = config.language || "pl";
      }
    } catch (error) {
      localStorage.removeItem("orionos.configuration.v1");
      window.location.replace("configuration/");
    }
  </script>
</body>
</html>
