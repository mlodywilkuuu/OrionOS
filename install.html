<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>Instalowanie OrionOS</title>
<style>
:root{--bg:#080d1b;--panel:#111a2d;--text:#f4f6ff;--muted:#a6b0c8;--accent:#8795ff;--accent2:#bd8bff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 10%,#657bff28,transparent 42%),radial-gradient(ellipse at 85% 90%,#a26bff20,transparent 40%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif}.panel{width:min(560px,100%);padding:clamp(25px,6vw,48px);border:1px solid #ffffff20;border-radius:22px;background:var(--panel);box-shadow:0 30px 100px #0008;text-align:center}.logo{font-size:13px;font-weight:800;letter-spacing:.24em;color:#e8ebff}.mark{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2))}.orb{width:90px;height:90px;margin:34px auto 26px;border:3px solid #ffffff14;border-top-color:var(--accent);border-right-color:var(--accent2);border-radius:50%;animation:spin 1.6s linear infinite;box-shadow:0 0 35px #8795ff22}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:25px;margin:0 0 9px;font-weight:650}.desc{font-size:12px;line-height:1.6;color:var(--muted);margin:0 auto 28px;max-width:390px}.track{height:7px;border-radius:9px;background:#ffffff13;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .3s}.row{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:11px;color:var(--muted)}.task{margin-top:28px;padding:14px;border:1px solid #ffffff14;border-radius:11px;background:#ffffff08;text-align:left;font-size:12px}.task b{display:block;margin-bottom:5px;font-weight:600}.foot{margin-top:25px;color:#73809d;font-size:10px}
</style></head><body><main class="panel"><div class="logo"><span class="mark">✦</span>ORIONOS</div><div class="orb"></div><h1 id="title">Przygotowywanie OrionOS</h1><p class="desc" id="desc">Trwa przygotowywanie Twojego środowiska. Nie zamykaj tej strony.</p><div class="track"><div class="fill" id="fill"></div></div><div class="row"><span id="status">Przygotowywanie systemu…</span><span id="percent">0%</span></div><div class="task"><b id="taskTitle">Konfigurowanie ustawień użytkownika</b><span id="taskDesc">Stosowanie wybranych preferencji.</span></div><div class="foot" id="foot">To symulowany proces konfiguracji wersji demonstracyjnej OrionOS.</div></main>
<script>
const KEY="orionos.configuration.v1",INSTALL="orionos.installation.v1";let config;
try{config=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!config){location.replace("configuration/");}
const en=config?.language==="en";document.documentElement.lang=config?.language||"pl";if(config?.appearance)document.body.style.backgroundColor=({dark:"#080d1b",midnight:"#050a1a",light:"#e9edf7",ocean:"#061522",forest:"#071711",rose:"#1a0c18"})[config.appearance]||"#080d1b";
if(config?.accent){let colors={violet:["#8795ff","#bd8bff"],blue:["#438bff","#77b5ff"],cyan:["#28b8c8","#73e0df"],sky:["#38a9e8","#8bd5ff"],indigo:["#5865dc","#9a8cff"],purple:["#9b65e8","#d0a0ff"],magenta:["#d64ab7","#f18acb"],pink:["#ee72aa","#ffb1ce"],red:["#e34e61","#ff8c91"],coral:["#ef7864","#ffb09a"],orange:["#ef923d","#ffc078"],amber:["#d6a326","#ffe080"],yellow:["#c3ad2e","#f4e879"],lime:["#8abf38","#c4e879"],green:["#3aa878","#8bd6a9"],emerald:["#20a887","#76ddc2"],teal:["#269f9b","#7ad5ca"],slate:["#8292a8","#b8c5d6"]};let c=colors[config.accent];if(c){document.documentElement.style.setProperty("--accent",c[0]);document.documentElement.style.setProperty("--accent2",c[1]);}}
const words=en?{title:"Preparing OrionOS",desc:"Your environment is being prepared. Please keep this page open.",status:"Preparing your system…",tasks:[["Applying user preferences","Saving your selected settings."],["Preparing language and region","Setting locale, time zone and keyboard."],["Customizing the desktop","Applying theme, accent color and interface scale."],["Configuring privacy options","Applying your privacy preferences."],["Finishing setup","Almost ready to start OrionOS."]],foot:"This is a simulated setup process for the OrionOS preview."}:{title:"Przygotowywanie OrionOS",desc:"Trwa przygotowywanie Twojego środowiska. Nie zamykaj tej strony.",status:"Przygotowywanie systemu…",tasks:[["Konfigurowanie ustawień użytkownika","Stosowanie wybranych preferencji."],["Przygotowywanie języka i regionu","Ustawianie języka, strefy czasowej i klawiatury."],["Personalizowanie pulpitu","Stosowanie motywu, koloru akcentu i skali interfejsu."],["Konfigurowanie prywatności","Stosowanie ustawień prywatności."],["Kończenie konfiguracji","OrionOS będzie za chwilę gotowy do uruchomienia."]],foot:"To symulowany proces konfiguracji wersji demonstracyjnej OrionOS."};
document.getElementById("title").textContent=words.title;document.getElementById("desc").textContent=words.desc;document.getElementById("status").textContent=words.status;document.getElementById("foot").textContent=words.foot;
let record;try{record=JSON.parse(localStorage.getItem(INSTALL)||"null")}catch(e){}
const complexity=(config?.telemetry?2:0)+(config?.location?2:0)+(config?.personalization?2:0)+(config?.animations?1:0)+(config?.sounds?1:0)+(config?.scale==="larger"?2:0)+(config?.language!=="pl"?2:0);
const duration=record?.duration||Math.min(42000,Math.max(18000,18000+complexity*1800));
const started=record?.startedAt||Date.now();localStorage.setItem(INSTALL,JSON.stringify({startedAt:started,duration}));
const fill=document.getElementById("fill"),percent=document.getElementById("percent"),taskTitle=document.getElementById("taskTitle"),taskDesc=document.getElementById("taskDesc");
function tick(){let progress=Math.min(1,(Date.now()-started)/duration),pct=Math.floor(progress*100);fill.style.width=pct+"%";percent.textContent=pct+"%";let i=Math.min(words.tasks.length-1,Math.floor(progress*words.tasks.length));taskTitle.textContent=words.tasks[i][0];taskDesc.textContent=words.tasks[i][1];if(progress>=1){localStorage.setItem(INSTALL,JSON.stringify({complete:true,completedAt:Date.now()}));location.replace("login.html");}}
tick();let timer=setInterval(()=>{tick();if(fill.style.width==="100%")clearInterval(timer)},180);
</script></body></html>
