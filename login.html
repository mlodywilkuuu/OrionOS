<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>Logowanie — OrionOS</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#080d1b;color:#f4f6ff;font-family:Inter,"Segoe UI",system-ui,sans-serif}.card{width:min(410px,calc(100% - 32px));padding:38px;border:1px solid #ffffff20;border-radius:22px;background:#111a2d;text-align:center;box-shadow:0 28px 90px #0008}.logo{font-size:22px;font-weight:800;letter-spacing:.22em}.mark{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#8795ff,#bd8bff);margin-right:8px}.avatar{width:68px;height:68px;margin:28px auto 14px;border-radius:50%;display:grid;place-items:center;background:#8795ff22;color:#aeb9ff;font-size:30px}h1{font-size:22px;margin:0 0 8px}p{font-size:12px;color:#a6b0c8;line-height:1.6;margin:0}.user{margin-top:20px;padding:11px;border:1px solid #ffffff18;border-radius:9px;background:#17233b;font-size:13px}.note{margin-top:22px;font-size:10px;color:#74819d}
</style></head><body><main class="card"><div class="logo"><span class="mark">✦</span>ORIONOS</div><div class="avatar">♙</div><h1 id="title">Witaj w OrionOS</h1><p id="message">Konfiguracja została zakończona. Panel logowania przygotujemy w kolejnym etapie.</p><div class="user" id="user"></div><button id="enter" type="button">Uruchom OrionOS <span>→</span></button><div class="note">ORIONOS · SYSTEM PREVIEW</div></main><script>
const c=JSON.parse(localStorage.getItem("orionos.configuration.v1")||"null");const i=JSON.parse(localStorage.getItem("orionos.installation.v1")||"null");if(!c)location.replace("configuration/");else if(!i?.complete)location.replace("install.html");else{document.getElementById("enter").addEventListener("click",()=>location.href="desktop.html");document.documentElement.lang=c.language||"pl";document.getElementById("user").textContent=c.username||"Użytkownik";if(c.language==="en"){document.getElementById("title").textContent="Welcome to OrionOS";document.getElementById("message").textContent="Konfiguracja zakończona. Twój pulpit jest gotowy.";document.getElementById("title").textContent="Witaj w OrionOS";document.getElementById("enter").textContent="Launch OrionOS →";}const themes={dark:"#080d1b",midnight:"#050a1a",light:"#e9edf7",ocean:"#061522",forest:"#071711",rose:"#1a0c18"};document.body.style.background=themes[c.appearance]||themes.dark;if(c.appearance==="light"){document.body.style.color="#18213a";document.querySelector(".card").style.background="#f8faff";document.querySelector(".card").style.color="#18213a";}}</script></body></html>
